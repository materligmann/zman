# Projet Xcode généré par XcodeGen : `xcodegen generate` dans apps/ios.
name: Zman
options:
  bundleIdPrefix: studio.100-8
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: BAJCWWQ6Q6
    CODE_SIGN_STYLE: Automatic
packages:
  ZmanCore:
    path: ZmanCore
targets:
  Zman:
    type: application
    platform: iOS
    sources:
      - Zman
      - Shared
    dependencies:
      - package: ZmanCore
      - target: ZmanWidget
    entitlements:
      path: Zman/Zman.entitlements
      properties:
        com.apple.security.application-groups: [group.studio.100-8.zman]
    info:
      path: Zman/Info.plist
      properties:
        CFBundleDisplayName: Zman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [fr, en, he]
        UIAppFonts: [EBGaramond-latin.ttf, EBGaramond-italic-latin.ttf, FrankRuhlLibre-hebrew.ttf]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.100-8.zman
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  ZmanWidget:
    type: app-extension
    platform: iOS
    sources:
      - ZmanWidget
      - Shared
    dependencies:
      - package: ZmanCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: ZmanWidget/ZmanWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.studio.100-8.zman]
    info:
      path: ZmanWidget/Info.plist
      properties:
        CFBundleDisplayName: Zman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [EBGaramond-latin.ttf, EBGaramond-italic-latin.ttf, FrankRuhlLibre-hebrew.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.100-8.zman.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  Zman:
    build:
      targets:
        Zman: all
        ZmanWidget: all
    test:
      targets: []
